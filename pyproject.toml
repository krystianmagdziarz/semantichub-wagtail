[project]
name = "semantichub-wagtail"
dynamic = ["version"]
description = "Wagtail integration for SemanticHub: receives generated articles over webhooks and turns them into pages awaiting editorial approval."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Krystian Magdziarz" }]
requires-python = ">=3.10"
keywords = ["wagtail", "django", "webhook", "cms", "semantichub"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 8",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Content Management System",
]
dependencies = [
    "wagtail>=8.0",
    "djangorestframework>=3.15",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "nh3>=0.2.14",
]

[project.urls]
Homepage = "https://github.com/krystianmagdziarz/semantichub-wagtail"
Source = "https://github.com/krystianmagdziarz/semantichub-wagtail"
Issues = "https://github.com/krystianmagdziarz/semantichub-wagtail/issues"
Changelog = "https://github.com/krystianmagdziarz/semantichub-wagtail/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-django>=4.9",
    "ruff>=0.6",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "semantichub_wagtail/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["semantichub_wagtail"]

[tool.hatch.build.targets.sdist]
include = [
    "/semantichub_wagtail",
    "/tests",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]
exclude = [
    "__pycache__",
    "*.py[cod]",
    "*.sqlite3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["semantichub_wagtail"]
omit = ["semantichub_wagtail/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "C4", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["semantichub_wagtail", "tests"]
